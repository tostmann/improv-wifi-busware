; Minimal Arduino-Core test firmware for improv-wifi-busware.
;
; Builds against the same library tree CULFW32 consumes via ESP-IDF, exercising
; the legacy Arduino facade (`<ImprovWiFiLibrary.h>`) and the ArduinoWiFiBackend.
; Targets the same ESP32-C6 lab board so the two factory binaries on the test
; landing page are interchangeable.

[platformio]
src_dir = src

[env:c6_arduino]
platform = espressif32
framework = arduino
board = esp32-c6-devkitc-1
monitor_speed = 115200
lib_ldf_mode = deep+

; Pull the lib in by relative path so this example builds from any checkout
; of the repo -- not a vendored copy. The file://../../components/... shape
; is also the migration target for downstream consumers (ip4knx etc.) that
; want to hack on the library and the firmware in lockstep.
lib_deps =
    Network
    WiFi
    WebServer
    symlink://../../components/improv_wifi_busware

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; arduino-esp32 3.x split WiFi/Network -- WiFi.h includes "Network.h"
    ; without exporting that include path. Same workaround as ip4knx.
    -I"/root/.platformio/packages/framework-arduinoespressif32/libraries/Network/src"
